version: "3.8"

# Local testing setup — runs all 5 nodes as Docker containers
# before pushing to AWS ECS.
#
# Leader-Follower (W=5, R=1):
#   docker compose --profile leader-w5r1 up
#
# Leader-Follower (W=1, R=5):
#   docker compose --profile leader-w1r5 up
#
# Leader-Follower (W=3, R=3):
#   docker compose --profile leader-w3r3 up
#
# Leaderless (W=5, R=1):
#   docker compose --profile leaderless up

services:

  # ── Leader-Follower W=5 R=1 ──────────────────────────────────────────────
  leader-w5r1:
    build: ./node
    profiles: [leader-w5r1]
    ports:
      - "8080:8080"
    environment:
      NODE_ID: node-0
      ROLE: leader
      W: 5
      R: 1
      PEERS: >
        http://follower1-w5r1:8080,
        http://follower2-w5r1:8080,
        http://follower3-w5r1:8080,
        http://follower4-w5r1:8080

  follower1-w5r1:
    build: ./node
    profiles: [leader-w5r1]
    ports:
      - "8081:8080"
    environment:
      NODE_ID: node-1
      ROLE: follower
      W: 5
      R: 1
      PEERS: ""

  follower2-w5r1:
    build: ./node
    profiles: [leader-w5r1]
    ports:
      - "8082:8080"
    environment:
      NODE_ID: node-2
      ROLE: follower
      W: 5
      R: 1
      PEERS: ""

  follower3-w5r1:
    build: ./node
    profiles: [leader-w5r1]
    ports:
      - "8083:8080"
    environment:
      NODE_ID: node-3
      ROLE: follower
      W: 5
      R: 1
      PEERS: ""

  follower4-w5r1:
    build: ./node
    profiles: [leader-w5r1]
    ports:
      - "8084:8080"
    environment:
      NODE_ID: node-4
      ROLE: follower
      W: 5
      R: 1
      PEERS: ""

  # ── Leader-Follower W=1 R=5 ──────────────────────────────────────────────
  leader-w1r5:
    build: ./node
    profiles: [leader-w1r5]
    ports:
      - "8080:8080"
    environment:
      NODE_ID: node-0
      ROLE: leader
      W: 1
      R: 5
      PEERS: >
        http://follower1-w1r5:8080,
        http://follower2-w1r5:8080,
        http://follower3-w1r5:8080,
        http://follower4-w1r5:8080

  follower1-w1r5:
    build: ./node
    profiles: [leader-w1r5]
    ports:
      - "8081:8080"
    environment:
      NODE_ID: node-1
      ROLE: follower
      W: 1
      R: 5
      PEERS: ""

  follower2-w1r5:
    build: ./node
    profiles: [leader-w1r5]
    ports:
      - "8082:8080"
    environment:
      NODE_ID: node-2
      ROLE: follower
      W: 1
      R: 5
      PEERS: ""

  follower3-w1r5:
    build: ./node
    profiles: [leader-w1r5]
    ports:
      - "8083:8080"
    environment:
      NODE_ID: node-3
      ROLE: follower
      W: 1
      R: 5
      PEERS: ""

  follower4-w1r5:
    build: ./node
    profiles: [leader-w1r5]
    ports:
      - "8084:8080"
    environment:
      NODE_ID: node-4
      ROLE: follower
      W: 1
      R: 5
      PEERS: ""

  # ── Leader-Follower W=3 R=3 ──────────────────────────────────────────────
  leader-w3r3:
    build: ./node
    profiles: [leader-w3r3]
    ports:
      - "8080:8080"
    environment:
      NODE_ID: node-0
      ROLE: leader
      W: 3
      R: 3
      PEERS: >
        http://follower1-w3r3:8080,
        http://follower2-w3r3:8080,
        http://follower3-w3r3:8080,
        http://follower4-w3r3:8080

  follower1-w3r3:
    build: ./node
    profiles: [leader-w3r3]
    ports:
      - "8081:8080"
    environment:
      NODE_ID: node-1
      ROLE: follower
      W: 3
      R: 3
      PEERS: ""

  follower2-w3r3:
    build: ./node
    profiles: [leader-w3r3]
    ports:
      - "8082:8080"
    environment:
      NODE_ID: node-2
      ROLE: follower
      W: 3
      R: 3
      PEERS: ""

  follower3-w3r3:
    build: ./node
    profiles: [leader-w3r3]
    ports:
      - "8083:8080"
    environment:
      NODE_ID: node-3
      ROLE: follower
      W: 3
      R: 3
      PEERS: ""

  follower4-w3r3:
    build: ./node
    profiles: [leader-w3r3]
    ports:
      - "8084:8080"
    environment:
      NODE_ID: node-4
      ROLE: follower
      W: 3
      R: 3
      PEERS: ""

  # ── Leaderless W=5 R=1 ───────────────────────────────────────────────────
  leaderless-0:
    build: ./node
    profiles: [leaderless]
    ports:
      - "9080:8080"
    environment:
      NODE_ID: node-0
      ROLE: leaderless
      W: 5
      R: 1
      PEERS: >
        http://leaderless-1:8080,
        http://leaderless-2:8080,
        http://leaderless-3:8080,
        http://leaderless-4:8080

  leaderless-1:
    build: ./node
    profiles: [leaderless]
    ports:
      - "9081:8080"
    environment:
      NODE_ID: node-1
      ROLE: leaderless
      W: 5
      R: 1
      PEERS: >
        http://leaderless-0:8080,
        http://leaderless-2:8080,
        http://leaderless-3:8080,
        http://leaderless-4:8080

  leaderless-2:
    build: ./node
    profiles: [leaderless]
    ports:
      - "9082:8080"
    environment:
      NODE_ID: node-2
      ROLE: leaderless
      W: 5
      R: 1
      PEERS: >
        http://leaderless-0:8080,
        http://leaderless-1:8080,
        http://leaderless-3:8080,
        http://leaderless-4:8080

  leaderless-3:
    build: ./node
    profiles: [leaderless]
    ports:
      - "9083:8080"
    environment:
      NODE_ID: node-3
      ROLE: leaderless
      W: 5
      R: 1
      PEERS: >
        http://leaderless-0:8080,
        http://leaderless-1:8080,
        http://leaderless-2:8080,
        http://leaderless-4:8080

  leaderless-4:
    build: ./node
    profiles: [leaderless]
    ports:
      - "9084:8080"
    environment:
      NODE_ID: node-4
      ROLE: leaderless
      W: 5
      R: 1
      PEERS: >
        http://leaderless-0:8080,
        http://leaderless-1:8080,
        http://leaderless-2:8080,
        http://leaderless-3:8080