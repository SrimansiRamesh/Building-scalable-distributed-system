
services:
  master:
    build: .
    ports:
      - "8089:8089"
    working_dir: /app/results
    volumes:
      - ./locustfile.py:/app/locustfile.py
      - ./results:/app/results
    command: -f /app/locustfile.py --master --expect-workers=2
    networks:
      - locust

  worker:
    build: .
    working_dir: /app/results
    volumes:
      - ./locustfile.py:/app/locustfile.py
      - ./results:/app/results
    command: -f /app/locustfile.py --worker --master-host=master
    depends_on:
      - master
    networks:
      - locust


networks:
  locust:
    driver: bridge